<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ikon Capsa Banting Kung2: kipas 4 kartu (3♦, K♣, A♥, 2♠ di depan) di laken biru + tulisan emas. PNG dibuat scripts/icons.cjs. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#3a72c4"/><stop offset="1" stop-color="#0c1e48"/></radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#e9b43a"/><stop offset="1" stop-color="#9a6410"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbd0"/><stop offset=".42" stop-color="#ffd54a"/><stop offset=".75" stop-color="#f3a51b"/><stop offset="1" stop-color="#c76a0a"/></linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#efe5cc"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
    <path id="dia" d="M12 1.5 20 12 12 22.5 4 12Z"/>
    <path id="clb" d="M12 2.2a4.7 4.7 0 0 1 4.6 5.7 4.7 4.7 0 1 1-2.5 8.1c.3 2.4 1 4.5 2.3 6.5H7.6c1.3-2 2-4.1 2.3-6.5a4.7 4.7 0 1 1-2.5-8.1A4.7 4.7 0 0 1 12 2.2Z"/>
    <path id="hrt" d="M12 22C5.2 16.3 2 12.3 2 8.2A5.3 5.3 0 0 1 12 5.8 5.3 5.3 0 0 1 22 8.2C22 12.3 18.8 16.3 12 22Z"/>
    <path id="spd" d="M12 1.5C8.5 6.5 2.5 9.3 2.5 14.2a4.7 4.7 0 0 0 8.3 3c-.3 2-1.1 3.8-2.3 5.3h7c-1.2-1.5-2-3.3-2.3-5.3a4.7 4.7 0 0 0 8.3-3C21.5 9.3 15.5 6.5 12 1.5Z"/>
  </defs>
  <g id="art">
    <g filter="url(#sh)" font-family="Arial Narrow, Arial, sans-serif" font-weight="900">
      <g transform="rotate(-30 256 420)">
        <rect x="181" y="120" width="150" height="210" rx="16" fill="url(#ivory)" stroke="#7a5a2a" stroke-opacity=".35" stroke-width="2"/>
        <text x="197" y="170" font-size="46" fill="#cf1f2c">3</text>
        <use href="#dia" transform="translate(246 225) scale(3.1)" fill="#cf1f2c"/>
      </g>
      <g transform="rotate(-10 256 420)">
        <rect x="181" y="120" width="150" height="210" rx="16" fill="url(#ivory)" stroke="#7a5a2a" stroke-opacity=".35" stroke-width="2"/>
        <text x="197" y="170" font-size="46" fill="#18212b">K</text>
        <use href="#clb" transform="translate(246 225) scale(3.1)" fill="#18212b"/>
      </g>
      <g transform="rotate(10 256 420)">
        <rect x="181" y="120" width="150" height="210" rx="16" fill="url(#ivory)" stroke="#7a5a2a" stroke-opacity=".35" stroke-width="2"/>
        <text x="197" y="170" font-size="46" fill="#cf1f2c">A</text>
        <use href="#hrt" transform="translate(246 225) scale(3.1)" fill="#cf1f2c"/>
      </g>
      <g transform="rotate(30 256 420)">
        <rect x="181" y="116" width="150" height="214" rx="16" fill="#fff3d8" stroke="#b8862b" stroke-width="4"/>
        <text x="197" y="168" font-size="48" fill="#18212b">2</text>
        <use href="#spd" transform="translate(240 215) scale(3.5)" fill="#18212b"/>
      </g>
    </g>
    <!-- tulisan -->
    <g font-family="Georgia, 'DejaVu Serif', serif" font-weight="900" text-anchor="middle" stroke="#0a1a40" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
      <text x="256" y="408" font-size="58" fill="url(#gold)" letter-spacing="1">CAPSA</text>
      <text x="256" y="462" font-size="50" fill="url(#gold)" letter-spacing="1">BANTING</text>
      <text x="256" y="498" font-size="28" fill="url(#gold)" letter-spacing="6">KUNG2</text>
    </g>
  </g>
</svg>
